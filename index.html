<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House Bardies Christmas 2026</title>
<style>
:root{--bg:#fbf6ee;--card:#fff;--tx:#2b2523;--mu:#7b7068;--ac:#b3262d;--gr:#1f6b46;--bd:#e8dccb;--ok:#e3f1e6}
@media (prefers-color-scheme:dark){:root{--bg:#171413;--card:#241f1d;--tx:#f3ede5;--mu:#a89f94;--ac:#f0646b;--gr:#5cc28c;--bd:#3d3532;--ok:#1d3025;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:3px double var(--bd);gap:10px;flex-wrap:wrap}
h1{font-size:19px;margin:0;color:var(--ac)}main{max-width:1000px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
input,select,button,textarea{font:inherit;border-radius:8px;border:1px solid var(--bd);padding:8px 10px;background:var(--card);color:var(--tx)}
input[type=text],input[type=password],input:not([type]),select{width:100%;margin:4px 0 10px}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.s{padding:3px 9px;font-size:13px}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button.on{background:var(--tx);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.item{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}.item:first-of-type{border-top:0}
.item img{width:56px;height:56px;object-fit:cover;border-radius:8px;flex:none}.item .b{flex:1;min-width:0;overflow-wrap:anywhere}
.item.t .ti{text-decoration:line-through;color:var(--mu)}
.tag{font-size:11px;background:var(--ok);color:var(--gr);padding:1px 7px;border-radius:99px;margin-left:6px;white-space:nowrap}
.pr{font-size:11px;color:var(--ac);margin-left:6px}.btns{display:flex;flex-direction:column;gap:4px}
.mu{color:var(--mu);font-size:13px}.err{color:#dc2626;font-size:13px;min-height:18px}a{color:var(--ac)}.hide{display:none}
.banner{background:var(--ac);color:#fff;border-radius:12px;padding:12px 16px;margin-bottom:16px}
</style></head><body>
<header><h1>🎄 House Bardies Christmas 2026</h1><div id="who"></div></header>
<main>
<div id="msg" class="err"></div>
<section id="auth" class="card hide" style="max-width:370px;margin:30px auto">
<h2 id="at" style="margin-top:0">Log in</h2>
<label>Username<input id="u" autocomplete="username" maxlength="20"></label>
<label>Password<input id="p" type="password" autocomplete="current-password"></label>
<label id="cw" class="hide">Family invite code<input id="c"></label>
<div id="ae" class="err"></div>
<button class="p" id="go">Log in</button> <button id="sw" class="s">Create account</button>
</section>
<section id="app" class="hide">
<div class="banner" id="bn"></div>
<div class="tabs"><button id="t1" class="on">Everyone's lists</button><button id="t2">My "to gift" list</button></div>
<div id="board">
<div class="card"><b id="ft">My wishlist</b> <span id="cnt" class="mu"></span>
<div id="fm" style="margin-top:10px">
<input id="wt" placeholder="Item name *" maxlength="80">
<div class="row"><input id="wn" placeholder="Note (size, colour…)" maxlength="120"><input id="wpr" placeholder="Approx. price" maxlength="20"></div>
<input id="wl" placeholder="Link (https://…)">
<div class="row"><select id="wpi"><option value="1">Must-have</option><option value="2" selected>Nice to have</option><option value="3">Dream</option></select>
<label style="padding-top:8px"><input type="checkbox" id="wg"> Group gift OK (several can chip in)</label></div>
<input id="wi" type="file" accept="image/*" style="margin-bottom:10px">
<div id="we" class="err"></div><button class="p" id="add">Add item</button> <button id="cx" class="hide">Cancel edit</button></div></div>
<div id="lists" class="grid"></div></div>
<div id="gifts" class="hide"></div>
</section></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,getDoc,deleteDoc,onSnapshot,increment} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ====== 1. PASTE YOUR FIREBASE CONFIG HERE (see README) ======
const firebaseConfig={
  apiKey:"AIzaSyCYmnpfs27mhCIapWR6ckOT2582MD8T9n8",
  authDomain:"house-bardies-christmas-2026.firebaseapp.com",
  projectId:"house-bardies-christmas-2026",
  storageBucket:"house-bardies-christmas-2026.firebasestorage.app",
  messagingSenderId:"504469730302",
  appId:"1:504469730302:web:7052a64d00612cd14a86af"
};
const EVENT_DATE="2026-12-25",MAX=10,DOMAIN="@bardies.example";
// =============================================================

const $=s=>document.querySelector(s);
const h=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a)k=='class'?e.className=a[k]:k.startsWith('on')?e.addEventListener(k.slice(2),a[k]):e.setAttribute(k,a[k]);c.flat().filter(x=>x!=null&&x!==false).forEach(x=>e.append(x));return e};
const S={uid:null,profiles:[],wishes:[],taken:{},gifts:[],reg:false,tab:1,edit:null,img:undefined};
const PR=["","Must-have","Nice to have","Dream"];
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:null;
if(firebaseConfig.apiKey==="PASTE"){$('#msg').textContent='Setup needed: paste your Firebase config into index.html (see README).';throw 0}
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let unsubs=[];

onAuthStateChanged(auth,u=>{
 unsubs.forEach(f=>f());unsubs=[];S.uid=u?u.uid:null;
 if(u){
  const sub=(q,fn)=>unsubs.push(onSnapshot(q,fn,e=>$('#msg').textContent=e.message));
  sub(collection(db,'profiles'),s=>{S.profiles=s.docs.map(d=>({id:d.id,...d.data()}));render()});
  sub(collection(db,'wishes'),s=>{S.wishes=s.docs.map(d=>({id:d.id,...d.data()}));render()});
  sub(collection(db,'taken'),s=>{S.taken={};s.docs.forEach(d=>S.taken[d.id]=d.data().n||0);render()});
  sub(collection(db,'users',u.uid,'gifts'),s=>{S.gifts=s.docs.map(d=>d.data());render()});
 }
 render();
});

const me=()=>S.profiles.find(p=>p.id===S.uid);
function render(){
 const on=!!S.uid&&!!me();
 $('#auth').classList.toggle('hide',!!S.uid);$('#app').classList.toggle('hide',!on);
 $('#at').textContent=S.reg?'Create account':'Log in';$('#go').textContent=S.reg?'Sign up':'Log in';
 $('#sw').textContent=S.reg?'I have an account':'Create account';$('#cw').classList.toggle('hide',!S.reg);
 $('#who').replaceChildren(...(S.uid?[h('span',{class:'mu'},(me()?.name||'')+' '),h('button',{class:'s',onclick:()=>signOut(auth)},'Log out')]:[]));
 if(!on)return;
 const mine=S.wishes.filter(w=>w.owner===S.uid),days=Math.ceil((new Date(EVENT_DATE+'T00:00')-new Date())/864e5);
 const empty=S.profiles.filter(p=>p.id!==S.uid&&!S.wishes.some(w=>w.owner===p.id)).length;
 $('#bn').textContent=(days>0?`🎁 ${days} days until Christmas.`:'🎅 Merry Christmas!')+(mine.length===0?' You haven\'t added any wishes yet!':'')+(empty?` ${empty} ${empty>1?'people haven\'t':'person hasn\'t'} made a list yet.`:'')+(S.gifts.length===0&&days>0&&days<=30?' You haven\'t picked any gifts yet — time to shop!':'');
 $('#cnt').textContent=S.edit?'':`(${mine.length}/${MAX})`;$('#fm').classList.toggle('hide',!S.edit&&mine.length>=MAX);
 $('#board').classList.toggle('hide',S.tab!==1);$('#gifts').classList.toggle('hide',S.tab!==2);
 $('#t1').className=S.tab===1?'on':'';$('#t2').className=S.tab===2?'on':'';
 const ps=[...S.profiles].sort((a,b)=>(b.id===S.uid)-(a.id===S.uid)||a.name.localeCompare(b.name));
 $('#lists').replaceChildren(...ps.map(p=>{
  const ws=S.wishes.filter(w=>w.owner===p.id).sort((a,b)=>(a.pri||2)-(b.pri||2)||a.ts-b.ts);
  return h('div',{class:'card'},h('b',{},p.id===S.uid?'My list':p.name+"'s list"),
   ws.length?ws.map(w=>item(w,p.id===S.uid)):h('div',{class:'mu'},'No list yet.'))}));
 const by={};S.gifts.forEach(g=>(by[g.owner]??=[]).push(g));
 $('#gifts').replaceChildren(h('div',{class:'card'},h('b',{},'Items I\'m getting'),h('div',{class:'mu'},'Only you can see this list.'),
  S.gifts.length?Object.entries(by).map(([o,gs])=>h('div',{style:'margin-top:12px'},h('b',{},'For '+(S.profiles.find(p=>p.id===o)?.name||'?')),
   gs.map(g=>{const w=S.wishes.find(x=>x.id===g.wish);
    return h('div',{class:'item'},w?.img?h('img',{src:w.img,alt:''}):null,
     h('div',{class:'b'},h('div',{},g.title,w?.price?h('span',{class:'mu'},' · '+w.price):null),!w?h('div',{class:'err'},'Removed from their list'):null,
      w&&safeUrl(w.link)?h('a',{href:w.link,target:'_blank',rel:'noopener noreferrer'},'Link'):null,
      w?.group?h('div',{class:'mu'},'Group gift — '+(S.taken[w.id]||1)+' chipping in'):null),
     h('button',{class:'s',onclick:()=>release(g.wish)},'Release'))}))):h('div',{class:'mu'},'Nothing chosen yet.')));
}
function item(w,own){
 const n=S.taken[w.id]||0,mine=S.gifts.some(g=>g.wish===w.id),strike=!own&&n>0&&!w.group;
 const act=own?[h('button',{class:'s',onclick:()=>edit(w)},'Edit'),h('button',{class:'s',onclick:()=>removeWish(w)},'Remove')]
  :mine?[h('button',{class:'s',onclick:()=>release(w.id)},'Release')]
  :(n===0||w.group)?[h('button',{class:'s p',onclick:()=>take(w)},w.group&&n?'Chip in':'I\'ll get this')]:[];
 return h('div',{class:'item'+(strike?' t':'')},w.img?h('img',{src:w.img,alt:''}):null,
  h('div',{class:'b'},h('div',{class:'ti'},w.title,w.pri?h('span',{class:'pr'},PR[w.pri]):null,
    strike?h('span',{class:'tag'},'taken'):null,(!own&&w.group)?h('span',{class:'tag'},n?n+' chipping in':'group gift'):null),
   w.note?h('div',{class:'mu'},w.note):null,w.price?h('div',{class:'mu'},w.price):null,
   safeUrl(w.link)?h('a',{href:w.link,target:'_blank',rel:'noopener noreferrer'},'View link'):null),
  h('div',{class:'btns'},act));
}
// ---- gifting: public count only; who chose it lives in users/<uid>/gifts (private) ----
async function take(w){
 await setDoc(doc(db,'taken',w.id),{n:increment(1)},{merge:true});
 await setDoc(doc(db,'users',S.uid,'gifts',w.id),{wish:w.id,owner:w.owner,title:w.title,ts:Date.now()});
}
async function release(id){
 await deleteDoc(doc(db,'users',S.uid,'gifts',id));
 const left=(S.taken[id]||1)-1;
 left<=0?await deleteDoc(doc(db,'taken',id)):await setDoc(doc(db,'taken',id),{n:increment(-1)},{merge:true});
}
async function removeWish(w){
 if(!confirm(`Remove "${w.title}"?`+(S.taken[w.id]?' Someone already chose it — they will see it was removed.':'')))return;
 await deleteDoc(doc(db,'wishes',w.id));await deleteDoc(doc(db,'taken',w.id)).catch(()=>{});
}
// ---- add / edit ----
function resize(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{
 const k=Math.min(1,360/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;
 c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.7))};i.onerror=()=>rej(Error('Not an image.'));i.src=r.result};r.readAsDataURL(file)})}
function edit(w){S.edit=w;S.img=undefined;$('#wt').value=w.title;$('#wn').value=w.note||'';$('#wpr').value=w.price||'';$('#wl').value=w.link||'';
 $('#wpi').value=w.pri||2;$('#wg').checked=!!w.group;$('#ft').textContent='Edit item';$('#add').textContent='Save changes';$('#cx').classList.remove('hide');render();scrollTo(0,0)}
function reset(){S.edit=null;S.img=undefined;['#wt','#wn','#wpr','#wl','#wi'].forEach(s=>$(s).value='');$('#wpi').value=2;$('#wg').checked=false;
 $('#ft').textContent='My wishlist';$('#add').textContent='Add item';$('#cx').classList.add('hide');render()}
$('#cx').onclick=reset;
$('#wl').onblur=()=>{const u=safeUrl($('#wl').value.trim());if(u&&!$('#wt').value){try{const s=new URL(u).pathname.split('/').filter(x=>x&&!/^\d+$/.test(x)).pop();
 if(s)$('#wt').value=decodeURIComponent(s).replace(/[-_+]/g,' ').slice(0,80)}catch(e){}}};
$('#add').onclick=async()=>{
 const title=$('#wt').value.trim(),link=$('#wl').value.trim(),f=$('#wi').files[0],e=$('#we');e.textContent='';
 if(!title)return e.textContent='Item name is required.';
 if(link&&!safeUrl(link))return e.textContent='Link must start with http:// or https://';
 if(!S.edit&&S.wishes.filter(w=>w.owner===S.uid).length>=MAX)return e.textContent='Limit of 10 items reached.';
 $('#add').disabled=true;
 try{
  const d={owner:S.uid,title,note:$('#wn').value.trim(),price:$('#wpr').value.trim(),link,pri:+$('#wpi').value,group:$('#wg').checked,ts:S.edit?S.edit.ts:Date.now()};
  d.img=f?await resize(f):(S.edit?.img||null);
  await setDoc(doc(db,'wishes',S.edit?S.edit.id:S.uid+'_'+Date.now().toString(36)),d);reset();
 }catch(x){e.textContent=x.message||'Could not save.'}
 $('#add').disabled=false;
};
// ---- auth (username is mapped to a private fake email; nothing is ever emailed) ----
$('#sw').onclick=()=>{S.reg=!S.reg;$('#ae').textContent='';render()};
$('#go').onclick=async()=>{
 const u=$('#u').value.trim().toLowerCase(),p=$('#p').value,e=$('#ae');e.textContent='';
 if(!/^[a-z0-9_]{3,20}$/.test(u))return e.textContent='Username: 3–20 letters, numbers or _';
 if(p.length<6)return e.textContent='Password must be at least 6 characters.';
 try{
  if(S.reg){
   const cr=await createUserWithEmailAndPassword(auth,u+DOMAIN,p);
   try{await setDoc(doc(db,'profiles',cr.user.uid),{name:u,code:$('#c').value.trim()})}
   catch(x){await cr.user.delete();throw Error('Wrong family invite code.')}
  }else await signInWithEmailAndPassword(auth,u+DOMAIN,p);
  $('#p').value='';
 }catch(x){e.textContent=/email-already/.test(x.code)?'That username is taken.':/invalid-credential|wrong-password|user-not-found/.test(x.code)?'Wrong username or password.':x.message}
};
$('#t1').onclick=()=>{S.tab=1;render()};$('#t2').onclick=()=>{S.tab=2;render()};
</script></body></html>
